  // Exakte Suche für bis zu drei Einkäufe. Gezählt werden nur vollständig freigeschaltete Gerichte.
  async function calculateBestValue(recipes,pantry,cap,shouldCancel=()=>false,onProgress=()=>{}){
    const available=availableIngredientIds(pantry),representatives=new Map();

    const ids=[...new Set(eligible.flatMap(r=>r.missing))].sort();
    if(!ids.length)return{ids:[],unlocked:[],count:0};
    const position=new Map(ids.map((id,n)=>[id,n]));
    const needs=eligible.map(r=>({id:r.id,missing:r.missing.map(id=>position.get(id))}));
    const frequency=ids.map(id=>allMissing.filter(r=>r.missing.includes(id)).length);
    let best={ids:[],unlocked:[],count:0,bonus:0},cycles=0;
    const evaluate=chosen=>{
      const unlocked=needs.filter(r=>r.missing.every(n=>chosen.includes(n))).map(r=>r.id);

    };
    const pause=async()=>{onProgress();await new Promise(resolve=>setTimeout(resolve,0));if(shouldCancel())throw new Error('cancelled');};
    for(let a=0;a<ids.length;a++){
      evaluate([a]);
      if(cap>=2)for(let b=a+1;b<ids.length;b++){
        evaluate([a,b]);
        if(cap>=3)for(let c=b+1;c<ids.length;c++){
          evaluate([a,b,c]);if(++cycles%5000===0)await pause();
        }
        if(++cycles%5000===0)await pause();
      }
      if(shouldCancel())throw new Error('cancelled');
    }
    return best;
  }

      '<div class="content-grid"><section aria-label="Deine Gerichte"><div class="list-tools"><div class="toolbar" role="search" aria-label="Rezeptsuche"><div class="search-wrap recipe-search">'+icon('search')+'<input class="input" id="meal-search" type="search" placeholder="Rezept oder Zutaten suchen …" aria-label="Rezepte oder Zutaten suchen" aria-controls="meal-results" autocomplete="off" value="'+esc(ui.query)+'"><button class="icon-button search-clear" data-action="clear-meal-query" aria-label="Suche leeren" '+(!ui.query?'hidden':'')+'>'+icon('close')+'</button></div><button class="icon-button help-button" data-action="search-help" aria-label="Hilfe zur Rezeptsuche">'+icon('help')+'</button></div><div class="filter-row" id="meal-filters">'+renderFilters(matches)+'</div></div><div id="meal-results">'+renderMealResults(matches)+'</div></section><aside class="side-stack plan-aside recipe-selection" aria-label="Deine Auswahl"><div class="panel" id="plan-panel">'+renderPlanPanel()+'</div></aside></div>'+renderMobilePlan();

  function renderEmptyMeals(){
    return '<div class="empty first-start"><h3>Lade deine Rezeptsammlung</h3><p>Wähle deine aktuelle JSON. Danach kannst du alle Rezepte durchsuchen.</p><div class="empty-actions"><button class="button" data-action="load-file">'+icon('upload')+'JSON laden</button><button class="button primary" data-action="new-recipe">'+icon('plus')+'Erstes Rezept erstellen</button></div></div>';
  }
  // Die Suche verändert ausschließlich die Ansicht, niemals die JSON-Daten.
  function searchText(value){return fold(value).replace(/ae/g,'a').replace(/oe/g,'o').replace(/ue/g,'u');}
  function matchesMealQuery(r,query=ui.query){
    const terms=String(query).trim().split(/[\s,;]+/).filter(Boolean);
    if(!terms.length)return true;
    const text=searchText([recipeLabel(r),...r.items.map(it=>ingredient(it.ingredientId).name)].join(' '));
    if(text.includes(searchText(canonicalName(query))))return true;
    return terms.every(term=>text.includes(searchText(term))||text.includes(searchText(canonicalName(term))));
  }
  function renderFilters(matches){
    const found=matches.filter(({r})=>matchesMealQuery(r));
    return[['all','Alle',found.length],['ready','Kochbar',found.filter(x=>x.m.status==='ready').length],['near','Fast möglich',found.filter(x=>x.m.status==='near').length],['other','Weitere',found.filter(x=>x.m.status==='other').length]].map(([value,label,count])=>'<button class="filter '+(ui.filter===value?'active':'')+'" data-action="filter" data-filter="'+value+'" aria-pressed="'+(ui.filter===value)+'">'+label+'<span class="filter-count">'+count+'</span></button>').join('');
  }
  function renderMealResults(matches=state.recipes.map((r,index)=>({r,index,m:getMatch(r)}))){
    if(!state.recipes.length)return renderEmptyMeals();
    const query=ui.query.trim();
    const rows=matches.filter(({r,m})=>(ui.filter==='all'||m.status===ui.filter)&&matchesMealQuery(r));
    rows.sort((a,b)=>({ready:0,near:1,other:2}[a.m.status]-{ready:0,near:1,other:2}[b.m.status])||b.m.score-a.m.score||a.m.missing.length-b.m.missing.length||a.index-b.index);
    return '<div class="results-note" role="status" aria-live="polite" aria-atomic="true">'+rows.length+' '+(rows.length===1?'Rezept':'Rezepte')+(query?' für „'+esc(query)+'“':' in deiner Sammlung')+'</div><div class="meal-grid">'+(rows.length?rows.map(renderMealCard).join(''):'<div class="empty">'+icon('search')+'<h3>Kein passendes Rezept</h3><p>Versuche andere Begriffe oder setze Suche und Filter zurück.</p><button class="button compact" data-action="clear-search">Alle Rezepte zeigen</button></div>')+'</div>';
  }

  function renderMealCard({r,m}){

  function renderPlanPanel(){return '<h3>Deine Auswahl <span class="muted small">'+state.plan.length+'</span></h3>'+(state.plan.length?'<ul class="planned-list">'+state.plan.map(id=>{const r=recipe(id);return'<li class="planned-row"><span>'+esc(recipeLabel(r))+'</span><button class="icon-button" data-action="plan" data-id="'+id+'" aria-label="'+esc(r.name)+' aus der Auswahl entfernen">'+icon('close')+'</button></li>';}).join('')+'</ul><p>'+getShopping().length+' unterschiedliche Zutaten fehlen.</p><button class="button compact" style="width:100%" data-action="tab" data-tab="einkauf">Zur Einkaufsliste '+'</button>':'<p>Plane ein paar Gerichte ein. Die fehlenden Zutaten kommen gemeinsam auf deine Einkaufsliste.</p>');}

    return '<header class="page-top"><h1>Zutaten & Vorrat</h1><div class="page-actions"><button class="button" data-action="open-groups">'+icon('swap')+'Austauschbar</button><button class="button primary" data-action="new-ingredient">'+icon('plus')+'Neue Zutat</button></div></header><div class="list-tools"><div class="toolbar" role="search" aria-label="Zutatensuche"><div class="search-wrap recipe-search">'+icon('search')+'<input class="input" id="pantry-search" type="search" placeholder="Zutat suchen …" aria-label="Zutaten suchen" aria-controls="pantry-results" autocomplete="off" value="'+esc(ui.pantryQuery)+'"><button class="icon-button search-clear" data-action="clear-pantry-query" aria-label="Zutatensuche leeren" '+(!ui.pantryQuery?'hidden':'')+'>'+icon('close')+'</button></div><button class="icon-button help-button" data-action="search-help" data-kind="pantry" aria-label="Hilfe zum Vorrat">'+icon('help')+'</button></div><div class="pantry-tools"><button class="filter '+(ui.availableOnly?'active':'')+'" data-action="filter-pantry" aria-pressed="'+ui.availableOnly+'">Nur vorhandene</button><button class="text-button small" data-action="clear-pantry">Vorrat leeren</button></div></div><div id="pantry-results">'+renderPantryResults()+'</div>';

  function matchesPantryQuery(i,query=ui.pantryQuery){

      }).join('')+'</div></details>';

  function openGroups(id=null,seedId=null){

  function openGroupEditor(id=null,seedId=null){
    const group=state.ingredientGroups.find(g=>g.id===id);

  function renderGroupChoices(){

    return rows.filter(i=>!draft.selected.has(i.id)).length?rows.filter(i=>!draft.selected.has(i.id)).map(i=>{
      const current=ingredientGroup(i.id),blocked=current&&current.id!==draft.id,selected=draft.selected.has(i.id);
      return '<button type="button" class="group-choice '+(selected?'selected':'')+'" data-action="toggle-group-member" data-id="'+i.id+'" aria-pressed="'+selected+'" '+(blocked?'disabled':'')+'><span>'+esc(i.name)+'</span>'+(blocked?'<small>'+esc(current.name)+'</small>':selected?icon('check'):icon('plus'))+'</button>';

  function renderSelectedGroupMembers(){
    return [...ui.groupDraft.selected].map(id=>'<button type="button" class="group-selected-chip" data-action="toggle-group-member" data-id="'+id+'" aria-label="'+esc(ingredient(id).name)+' aus der Auswahl entfernen">'+esc(ingredient(id).name)+icon('close')+'</button>').join('')||'<p class="muted">Noch keine Zutaten ausgewählt.</p>';

    document.getElementById('group-choices').innerHTML=renderGroupChoices();

  function saveGroup(){
    const draft=ui.groupDraft,error=document.getElementById('group-error');
    const name=document.getElementById('group-name').value.trim(),ids=[...draft.selected];
    if(!name||name.length>80){error.textContent='Gib der Gruppe einen Namen mit höchstens 80 Zeichen.';return;}
    if(ids.length<2){error.textContent='Wähle mindestens zwei Zutaten.';return;}
    if(ids.some(id=>!ingredient(id)||state.ingredientGroups.some(g=>g.id!==draft.id&&g.ingredientIds.includes(id)))){error.textContent='Eine Zutat gehört bereits zu einer anderen Gruppe.';return;}
    if(!draft.id&&state.ingredientGroups.length>=100){error.textContent='Maximal 100 Gruppen sind möglich.';return;}
    const old=state.ingredientGroups.find(g=>g.id===draft.id),group={...old,id:draft.id||uid('g'),name,ingredientIds:ids};
    if(old)state.ingredientGroups[state.ingredientGroups.indexOf(old)]=group;else state.ingredientGroups.push(group);
    ui.groupDraft=null;ui.dialogTrail=[];commit();openGroups();toast('Austauschbare Zutaten gespeichert.');
  }

  function renderShoppingRows(rows){
    if(!rows.length)return '<div class="empty" style="margin-bottom:20px">'+icon('check')+'<h3>Keine offenen Einkaufspositionen</h3><p>'+(state.shoppingExcluded.length?'Entfernte Zutaten kannst du im Rezept oder über das Eingabefeld wieder hinzufügen.':'Plane Gerichte ein oder ergänze unten eigene Zutaten.')+'</p><button class="button compact" data-action="tab" data-tab="gerichte">Gerichte auswählen</button></div>';

  function splitNames(text){return String(text).split(/[,;\n\r]+/).map(value=>value.replace(/^\s*[-*•]\s*/,'').trim()).filter(Boolean);}

  function ensureIngredient(name){
    const existing=findIngredient(name);if(existing)return existing;
    const canonical=canonicalName(name);
    const added={id:uid('i'),name:canonical.charAt(0).toUpperCase()+canonical.slice(1),category:'Sonstiges'};
    state.ingredients.push(added);return added;
  }
  function validateNewNames(names){
    if(!names.length)throw new Error('Füge mindestens eine Zutat hinzu.');
    if(names.length>100)throw new Error('Bitte höchstens 100 Zutaten auf einmal ergänzen.');
    if(names.some(name=>!name.trim()||canonicalName(name).length>120))throw new Error('Ein Zutatenname darf höchstens 120 Zeichen lang sein.');
    const newNames=new Set(names.filter(name=>!findIngredient(name)).map(name=>fold(canonicalName(name))));
    if(state.ingredients.length+newNames.size>1500)throw new Error('Es sind höchstens 1.500 Zutaten möglich.');
  }
  function addNames(text,target){

      else{state.extras=[...new Set([...state.extras,...ids.filter(id=>!state.pantry.includes(id))])];restoreShopping(ids);}
      commit();toast(target==='pantry'?ids.length+' Zutaten zum Vorrat hinzugefügt.':'Einkaufsliste ergänzt. Vorhandene Zutaten werden ausgelassen.');

  function saveRecipe(form){
    const errorEl=document.getElementById('recipe-error');errorEl.textContent='';
    try{
      const name=document.getElementById('recipe-name').value.trim(),old=recipe(form.dataset.id),subtitle=old?.subtitle||'',notes=old?.notes||'';

      const id=form.dataset.id||uid('r');if(!form.dataset.id&&state.recipes.length>=300)throw new Error('Es sind höchstens 300 Gerichte möglich.');
      const r={...old,id,name,subtitle,notes,items:rows.map(row=>{const ingredientId=ensureIngredient(row.name).id;return{...old?.items.find(item=>item.ingredientId===ingredientId),ingredientId,role:row.role};})};

  const MAX_FILE_BYTES=3*1024*1024;
  function serializeState(data=state){return JSON.stringify({...data,savedAt:new Date().toISOString()},null,2);}
  function readDocument(text){
    if(typeof text!=='string'||new TextEncoder().encode(text).length>MAX_FILE_BYTES)throw new Error('Bitte eine Meal-Match-Datei unter 3 MB verwenden.');
    return validateState(JSON.parse(text.replace(/^\uFEFF/,'')));
  }
  function clearFileError(){document.getElementById('file-error').hidden=true;document.getElementById('file-error-message').textContent='';}
  function showImportError(error){

    document.getElementById('file-error-message').textContent=message+' Dein aktueller Stand bleibt erhalten.';document.getElementById('file-error').hidden=false;

  function jsonFilename(value){
    const clean=String(value||'meal-match.json').split(/[\\/]/).pop().replace(/[\x00-\x1f]/g,'').trim().slice(0,200)||'meal-match.json';
    return /\.json$/i.test(clean)?clean:clean+'.json';

  function applyImport(next,name){
    state=next;resetHistory();fileMeta.name=name;fileMeta.hasFile=true;fileMeta.savedFingerprint=fingerprint(next);fileMeta.lastSavedAt=new Date().toISOString();fileMeta.lastAction='JSON geladen';
    ui.query='';ui.filter='all';ui.pantryQuery='';ui.availableOnly=false;ui.detailId=null;ui.ingredientId=null;ui.pendingRemoval=null;ui.pendingImport=null;ui.groupDraft=null;ui.planExpanded=false;ui.dialogTrail=[];ui.viewScroll={gerichte:0,vorrat:0,einkauf:0};
    clearFileError();modal.close();commit();toast('JSON geladen. Dein gesamter Stand wurde ersetzt.');return true;
  }
  function acceptImport(text,name='meal-match.json'){
    // Erst vollständig prüfen. Bis zur Bestätigung bleiben Daten und Dateiname unverändert.
    const next=readDocument(text),filename=jsonFilename(name);
    if(isDirty()){
      ui.pendingImport={state:next,name:filename};
      showModal(modalHeader('Ungespeicherte Änderungen')+'<div class="modal-body"><p>Die neue JSON ersetzt deinen aktuellen Stand vollständig. Deine ungespeicherten Änderungen gehen dabei verloren.</p><p class="muted">Wenn du sie behalten möchtest, brich ab und klicke zuerst auf Speichern.</p><div class="import-summary"><strong>'+esc(filename)+'</strong>'+next.recipes.length+' Rezepte · '+next.ingredients.length+' Zutaten</div><div class="modal-footer"><button class="button" data-action="cancel-import">Aktuellen Stand behalten</button><button class="button primary" data-action="confirm-import">'+icon('upload')+'JSON laden</button></div></div>','import-confirm');return false;
    }
    return applyImport(next,filename);
  }
  async function fileText(file){
    if(typeof file.text==='function')return file.text();
    return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(new Error('Die Datei konnte nicht gelesen werden.'));reader.readAsText(file);});
  }
  async function importData(file){
    if(!file||fileMeta.busy)return;
    fileMeta.busy=true;updateFileStatus();
    try{if(file.size>MAX_FILE_BYTES)throw new Error('Bitte eine JSON-Datei unter 3 MB auswählen.');acceptImport(await fileText(file),file.name);}
    catch(error){showImportError(error);}
    finally{document.getElementById('data-file-input').value='';fileMeta.busy=false;updateFileStatus();}
  }
  function loadFile(){
    if(fileMeta.busy)return;
    const input=document.getElementById('data-file-input');input.value='';input.click();
  }
  function markFileSaved(data,name){
    fileMeta.name=name;fileMeta.hasFile=true;fileMeta.savedFingerprint=fingerprint(data);fileMeta.lastSavedAt=new Date().toISOString();fileMeta.lastAction='Download erstellt';updateFileStatus();
  }
  function downloadData(){
    if(fileMeta.busy)return;
    fileMeta.busy=true;updateFileStatus();
    try{
      const snapshot=JSON.parse(JSON.stringify(state)),filename=fileMeta.name,text=serializeState(snapshot);
      downloadText(filename,text,'application/json;charset=utf-8');markFileSaved(snapshot,filename);clearFileError();toast('JSON-Download erstellt. Sichere die Datei am gewünschten Ort.');
    }catch(error){toast('Download fehlgeschlagen: '+error.message);}
    finally{fileMeta.busy=false;updateFileStatus();}
  }
  function isAppleMobile(){return /iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);}
  function shareableJSON(text,name){
    if(typeof navigator.share!=='function'||typeof navigator.canShare!=='function'||typeof File!=='function')return null;
    for(const type of ['application/json','text/plain']){
      try{const file=new File([text],name,{type});if(navigator.canShare({files:[file]}))return file;}catch(error){}
    }
    return null;
  }
  async function saveFile(){
    if(fileMeta.busy||!isDirty())return;
    const snapshot=JSON.parse(JSON.stringify(state)),file=isAppleMobile()?shareableJSON(serializeState(snapshot),fileMeta.name):null;
    if(!file){downloadData();return;}
    fileMeta.busy=true;updateFileStatus();
    try{await navigator.share({files:[file]});markFileSaved(snapshot,fileMeta.name);fileMeta.lastAction='Datei bereitgestellt';updateFileStatus();clearFileError();toast('JSON bereitgestellt. Speichere sie über „In Dateien sichern“.');}
    catch(error){if(error.name!=='AbortError')toast('Speichern wurde nicht abgeschlossen. Verwende den Download-Button.');}
    finally{fileMeta.busy=false;updateFileStatus();}
  }
  function toggleDetailRole(recipeId,ingredientId){
    const r=recipe(recipeId),it=r?.items.find(item=>item.ingredientId===ingredientId);if(!it)return;
    it.role=it.role==='required'?'optional':'required';const scroll=modal.querySelector('.modal-body')?.scrollTop||0;commit();openDetail(recipeId);if(modal.querySelector('.modal-body'))modal.querySelector('.modal-body').scrollTop=scroll;
    modal.querySelector('[data-action="toggle-detail-role"][data-ingredient="'+ingredientId+'"]')?.focus({preventScroll:true});
  }

  function restoreShopping(ids){const keys=new Set(ids.map(id=>equivalentKey(id)));state.shoppingExcluded=state.shoppingExcluded.filter(id=>!keys.has(equivalentKey(id)));}
  function addIngredientShopping(id,recipeId=null){
    if(!ingredient(id)||availableIngredientIds().has(id))return;
    state.extras=[...new Set([...state.extras,id])];restoreShopping([id]);
    if(recipeId&&recipe(recipeId)?.items.some(it=>it.ingredientId===id)&&!state.extraRecipes.some(source=>source.ingredientId===id&&source.recipeId===recipeId))state.extraRecipes.push({ingredientId:id,recipeId});
    const scroll=modal.querySelector('.modal-body')?.scrollTop||0;commit({invalidate:false});if(modal.open&&modal.dataset.kind==='detail'){openDetail(ui.detailId);if(modal.querySelector('.modal-body'))modal.querySelector('.modal-body').scrollTop=scroll;}toast('Zutat auf der Einkaufsliste.');
  }
  function createIngredients(form){
    const errorEl=document.getElementById('ingredient-add-error');errorEl.textContent='';
    try{
      const names=splitNames(document.getElementById('add-pantry').value),category=chosenCategory('ingredient-category','add-category-name');
      validateNewNames(names);

      const normalized=names.map(name=>fold(canonicalName(name))),duplicates=names.filter((name,index)=>findIngredient(name)||normalized.indexOf(normalized[index])!==index);
      if(duplicates.length)throw new Error('Bereits vorhanden oder doppelt: '+[...new Set(duplicates.map(canonicalName))].join(', ')+'. Markiere vorhandene Zutaten in der Liste.');
      registerCategory(category);const ids=names.map(name=>{const item=ensureIngredient(name);item.category=category;return item.id;});
      state.pantry=[...new Set([...state.pantry,...ids])];ui.pantryQuery='';ui.availableOnly=false;modal.close();commit();toast(ids.length===1?'Zutat hinzugefügt.':ids.length+' Zutaten hinzugefügt.');
    }catch(error){errorEl.textContent=error.message;}
  }
  function removalDialog(kind,id,affected){
    const i=ingredient(id);if(!i)return;ui.pendingRemoval={kind,id};
    const deleting=kind==='ingredient';
    showModal(modalHeader(deleting?'Zutat löschen?':'Aus Einkauf entfernen?')+'<div class="modal-body"><p><strong>'+esc(i.name)+'</strong></p><p>'+(deleting?'Diese Zutat wird auch aus den folgenden Rezepten entfernt:':'Diese Zutat ist notwendig für folgende Gerichte auf deiner Einkaufsliste:')+'</p><ul class="affected-recipes">'+affected.map(r=>'<li>'+esc(recipeLabel(r))+'</li>').join('')+'</ul>'+(deleting?'<p class="form-help">Die Rezepte bleiben erhalten. Falls ein Rezept danach keine Zutaten mehr hat, kannst du sie über „Bearbeiten“ wieder ergänzen.</p>':'<p class="form-help">Die Zutat wird nur aus der Einkaufsliste entfernt. Die Rezepte behalten ihre Zutaten.</p>')+'<div class="modal-footer"><button class="button" data-action="close-modal">Abbrechen</button><button class="button danger" data-action="confirm-removal">'+icon('trash')+(deleting?'Zutat löschen':'Entfernen')+'</button></div></div>','removal');
  }
  function requestIngredientRemoval(id){
    if(!ingredient(id))return;
    const affected=state.recipes.filter(r=>r.items.some(it=>it.ingredientId===id));
    if(affected.length)removalDialog('ingredient',id,affected);else removeIngredient(id);
  }
  function removeIngredient(id){
    state.ingredientGroups=state.ingredientGroups.map(g=>({...g,ingredientIds:g.ingredientIds.filter(value=>value!==id)})).filter(g=>g.ingredientIds.length>=2);
    state.ingredients=state.ingredients.filter(i=>i.id!==id);
    state.recipes.forEach(r=>{r.items=r.items.filter(it=>it.ingredientId!==id);});
    for(const key of ['pantry','extras','checked','shoppingExcluded'])state[key]=state[key].filter(value=>value!==id);
    state.extraRecipes=state.extraRecipes.filter(source=>source.ingredientId!==id);
    ui.pendingRemoval=null;modal.close();commit();toast('Zutat gelöscht.');
  }
  function requestShoppingRemoval(id){
    const row=getShopping().find(row=>equivalentKey(row.id)===equivalentKey(id));if(!row)return;
    const affected=state.recipes.filter(r=>row.recipeIds.includes(r.id)&&r.items.some(it=>equivalentKey(it.ingredientId)===equivalentKey(id)&&it.role==='required'));
    if(affected.length)removalDialog('shopping',id,affected);else removeShopping(id);
  }
  function removeShopping(id){
    const key=equivalentKey(id);state.shoppingExcluded=[...new Set([...state.shoppingExcluded,id])];state.extras=state.extras.filter(value=>equivalentKey(value)!==key);state.checked=state.checked.filter(value=>equivalentKey(value)!==key);
    state.extraRecipes=state.extraRecipes.filter(source=>equivalentKey(source.ingredientId)!==key);
    ui.pendingRemoval=null;modal.close();commit({invalidate:false});toast('Zutat aus der Einkaufsliste entfernt.');
  }

  window.MealMatchFiles={getState:()=>JSON.parse(JSON.stringify(state)),exportText:serializeState,importText:acceptImport,isDirty};

  document.addEventListener('click',event=>{
    const button=event.target.closest('[data-action]');if(!button||button.disabled)return;const action=button.dataset.action,id=button.dataset.id;
    const fileMenu=document.getElementById('file-menu');if(fileMenu)fileMenu.open=false;
    if(action==='discard-dialog')resolveDiscard(true);
    else if(action==='keep-dialog')resolveDiscard(false);
    else if(action==='undo')undoLastChange();
    else if(action==='dialog-back')backDialog();
    else if(action==='search-help')showSearchHelp(button.dataset.kind);
    else if(action==='toggle-mobile-plan'){ui.planExpanded=!ui.planExpanded;renderApp();}
    else if(action==='open-groups'){if(canLeaveDialog(()=>openGroups(button.dataset.group||null,button.dataset.ingredient||null)))openGroups(button.dataset.group||null,button.dataset.ingredient||null);}
    else if(action==='edit-group'){if(canLeaveDialog(()=>{pushDialog();openGroupEditor(id);})){pushDialog();openGroupEditor(id);}}
    else if(action==='new-group'){if(canLeaveDialog(()=>{pushDialog();openGroupEditor();})){pushDialog();openGroupEditor();}}
    else if(action==='delete-group'){state.ingredientGroups=state.ingredientGroups.filter(g=>g.id!==id);commit();openGroups();toast('Gruppe entfernt.');}
    else if(action==='toggle-group-member'){
      const draft=ui.groupDraft;if(!draft)return;
      if(draft.selected.has(id))draft.selected.delete(id);else draft.selected.add(id);
      refreshGroupChoices();
    }
    else if(action==='tab')setTab(button.dataset.tab);
    else if(action==='filter'){ui.filter=button.dataset.filter;refreshMeals();const active=document.querySelector('.filter.active');if(active)active.focus({preventScroll:true});}
    else if(action==='clear-search'||action==='clear-meal-query'){ui.query='';if(action==='clear-search')ui.filter='all';document.getElementById('meal-search').value='';refreshMeals();document.getElementById('meal-search').focus({preventScroll:true});}
    else if(action==='detail'){ui.dialogTrail=[];openDetail(id);}
    else if(action==='ingredient-detail')goToIngredient(id);
    else if(action==='ingredient-recipe')goToRecipe(id);
    else if(action==='new-ingredient')openNewIngredient();
    else if(action==='toggle-pantry')setPantry(id,!state.pantry.includes(id));
    else if(action==='clear-pantry-query'||action==='reset-pantry-filters'){
      ui.pantryQuery='';
      if(action==='reset-pantry-filters'){ui.availableOnly=false;renderApp();}
      document.getElementById('pantry-search').value='';refreshPantryResults();document.getElementById('pantry-search').focus({preventScroll:true});
    }
    else if(action==='filter-pantry'){
      ui.availableOnly=!ui.availableOnly;renderApp();
      document.querySelector('[data-action="filter-pantry"]').focus({preventScroll:true});
    }
    else if(action==='close-ingredient')closeIngredient();
    else if(action==='plan')togglePlan(id);
    else if(action==='new-recipe')openEditor();
    else if(action==='edit-recipe'){pushDialog();openEditor(id);}
    else if(action==='close-modal')closeDialog();
    else if(action==='cancel-import'){ui.pendingImport=null;modal.close();}
    else if(action==='confirm-import'){const pending=ui.pendingImport;if(pending)applyImport(pending.state,pending.name);}
    else if(action==='dismiss-file-error')clearFileError();
    else if(action==='load-file')loadFile();
    else if(action==='save-file')saveFile();
    else if(action==='download-data')downloadData();
    else if(action==='toggle-detail-role')toggleDetailRole(id,button.dataset.ingredient);
    else if(action==='add-ingredient-shopping')addIngredientShopping(id,button.dataset.recipe);
    else if(action==='delete-ingredient')requestIngredientRemoval(id);
    else if(action==='remove-shopping')requestShoppingRemoval(id);
    else if(action==='confirm-removal'){const pending=ui.pendingRemoval;if(pending){if(pending.kind==='ingredient')removeIngredient(pending.id);else removeShopping(pending.id);}}
    else if(action==='toggle-editor-role'){const next=button.dataset.role==='required'?'optional':'required';button.outerHTML=roleButton(next,'data-action="toggle-editor-role"',true);}
    else if(action==='open-value'){showModal(modalHeader('Best Value')+'<div class="modal-body value-mobile-dialog"><div class="panel value-panel" id="value-panel-modal">'+renderValuePanel('value-budget-modal')+'</div></div>','value');}
    else if(action==='add-editor-row'){document.getElementById('editor-rows').insertAdjacentHTML('beforeend',editorRow());const rows=document.querySelectorAll('#editor-rows .ingredient-name');rows[rows.length-1].focus();}
    else if(action==='remove-editor-row')button.closest('.edit-row').remove();
    else if(action==='bulk-editor'){
      try{const names=splitNames(document.getElementById('bulk-recipe-ingredients').value);validateNewNames(names);const existing=[...document.querySelectorAll('#editor-rows .ingredient-name')].map(input=>fold(canonicalName(input.value))).filter(Boolean);const used=new Set(existing),added=[];names.forEach(name=>{const canonical=canonicalName(name),key=fold(canonical);if(!used.has(key)){used.add(key);added.push(canonical);}});if(existing.length+added.length>100)throw new Error('Ein Gericht darf höchstens 100 Zutaten enthalten.');document.querySelectorAll('#editor-rows .edit-row').forEach(row=>{if(!row.querySelector('.ingredient-name').value.trim())row.remove();});const unique=[...new Set(added.map(canonicalName))];document.getElementById('editor-rows').insertAdjacentHTML('beforeend',unique.map(name=>editorRow(name)).join(''));document.getElementById('bulk-recipe-ingredients').value='';}catch(error){document.getElementById('recipe-error').textContent=error.message;}
    }
    else if(action==='delete-recipe'){
      const r=recipe(id);if(r&&window.confirm('„'+recipeLabel(r)+'“ wirklich löschen?')){state.recipes=state.recipes.filter(value=>value.id!==id);state.plan=state.plan.filter(value=>value!==id);state.extraRecipes=state.extraRecipes.filter(source=>source.recipeId!==id);modal.close();commit();toast('Gericht gelöscht.');}
    }
    else if(action==='clear-pantry'){if(state.pantry.length&&window.confirm('Alle Zutaten im Vorrat abwählen?')){state.pantry=[];state.checked=[];commit();toast('Vorrat geleert.');}}
    else if(action==='calculate-value')runValue();
    else if(action==='add-value'){if(ui.value){state.extras=[...new Set([...state.extras,...ui.value.ids.filter(value=>!state.pantry.includes(value))])];restoreShopping(ui.value.ids);commit({invalidate:false});toast('Vorschlag zur Einkaufsliste hinzugefügt.');}}
    else if(action==='clear-plan'){state.plan=[];commit({invalidate:false});toast('Gerichteauswahl geleert.');}
    else if(action==='buy-checked'){
      const bought=getShopping().filter(row=>shoppingIsChecked(row)).map(row=>state.checked.find(id=>equivalentKey(id)===equivalentKey(row.id))||row.id);if(!bought.length)return;state.pantry=[...new Set([...state.pantry,...bought])];const keys=new Set(bought.map(id=>equivalentKey(id)));state.extras=state.extras.filter(value=>!keys.has(equivalentKey(value)));state.checked=state.checked.filter(value=>!keys.has(equivalentKey(value)));commit();toast(bought.length+' Zutaten in den Vorrat übernommen.');
    }

  });
  document.addEventListener('click',event=>{
    const menu=document.getElementById('file-menu');
    if(menu&&(!menu.contains(event.target)||event.target.closest('[data-pwa-action]')))menu.open=false;
  });
  document.addEventListener('input',event=>{
    if(event.target.id==='edit-ingredient-name'||event.target.id==='edit-category-name')updateIngredientForm();
    if(event.target.id==='meal-search'){ui.query=event.target.value;refreshMeals();}
    if(event.target.id==='pantry-search'){ui.pantryQuery=event.target.value;refreshPantryResults();}
    if(event.target.id==='group-search'){ui.groupDraft.query=event.target.value;refreshGroupChoices();}
    if(event.target.id==='group-name')ui.groupDraft.name=event.target.value;
    if(event.target.id==='add-pantry'){const error=document.getElementById('ingredient-add-error');if(error)error.textContent='';}
  });
  document.addEventListener('toggle',event=>{
    const target=event.target;
    if(!target.matches?.('details[data-category]')||!app.contains(target)||ui.pantryQuery.trim())return;
    if(target.open)ui.collapsedCategories.delete(target.dataset.category);else ui.collapsedCategories.add(target.dataset.category);
  },true);
  document.addEventListener('keydown',event=>{
    if((event.ctrlKey||event.metaKey)&&!event.shiftKey&&event.key.toLowerCase()==='z'&&!modal.open&&!event.target.closest('input,textarea,select,[contenteditable="true"]')){
      if(undoStack.length){event.preventDefault();undoLastChange();}return;
    }
    if(event.target.id==='meal-search'&&event.key==='Escape'){event.preventDefault();ui.query='';event.target.value='';refreshMeals();}
    if(event.target.id==='pantry-search'&&event.key==='Escape'){event.preventDefault();ui.pantryQuery='';event.target.value='';refreshPantryResults();}
  });
  document.addEventListener('change',event=>{
    const target=event.target;
    if(target.id==='edit-ingredient-category'){showCategoryField('edit-ingredient-category','edit-category-name');updateIngredientForm();}
    else if(target.id==='ingredient-category')showCategoryField('ingredient-category','add-category-name');
    else if(target.dataset.shopping){const key=equivalentKey(target.dataset.shopping);state.checked=state.checked.filter(id=>equivalentKey(id)!==key);if(target.checked)state.checked.push(target.dataset.shopping);commit({invalidate:false});}
    else if(target.id==='value-budget'||target.id==='value-budget-modal'){ui.budget=Number(target.value);valueRun++;ui.value=null;ui.valueBusy=false;refreshValuePanel();}
    else if(target.id==='data-file-input')importData(target.files[0]);
  });
  document.addEventListener('submit',event=>{
    if(event.target.id==='group-form'){event.preventDefault();saveGroup();}
    else if(event.target.id==='ingredient-form'){event.preventDefault();saveIngredient(event.target);}
    else if(event.target.id==='recipe-form'){event.preventDefault();saveRecipe(event.target);}
    else if(event.target.id==='add-pantry-form'){event.preventDefault();createIngredients(event.target);}
    else if(event.target.id==='add-shopping-form'){event.preventDefault();addNames(document.getElementById('add-shopping').value,'shopping');}
  });
  modal.addEventListener('click',event=>{if(event.target===modal){const rect=modal.getBoundingClientRect();if(event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom){closeDialog();}}});
  window.addEventListener('hashchange',()=>{const tab=location.hash.slice(1);if(['gerichte','vorrat','einkauf'].includes(tab)&&tab!==ui.tab){setTab(tab);}});

  modal.addEventListener('cancel',event=>{event.preventDefault();closeDialog();});
  modal.addEventListener('close',()=>{ui.dialogBaseline='';});
  window.addEventListener('beforeunload',event=>{if(isDirty()){event.preventDefault();event.returnValue='';}});
  if(['gerichte','vorrat','einkauf'].includes(location.hash.slice(1)))ui.tab=location.hash.slice(1);
  function updateVisualViewport(){
    const viewport=window.visualViewport;
    document.documentElement?.style.setProperty('--viewport-height',(viewport?.height||window.innerHeight)+'px');
    document.documentElement?.style.setProperty('--viewport-top',(viewport?.offsetTop||0)+'px');
  }
  window.visualViewport?.addEventListener('resize',updateVisualViewport);
  window.visualViewport?.addEventListener('scroll',updateVisualViewport);
  window.addEventListener('resize',updateVisualViewport);
  updateVisualViewport();
  renderApp();
  updateFileStatus();
  window.MealMatchPWA={canReload:()=>!isDirty()};
  </script>
</body>
